name: Supabase Full Backup to SharePoint

on:
  schedule:
    - cron: '0 3 * * *' # Todo dia às 03:00 UTC (00:00 Horário de Brasília)
  workflow_dispatch:

jobs:
  backup-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Instalar Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          npm install

      - name: Criar Estrutura de Pastas e Definir Data
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "TODAY_DATE=$DATE" >> $GITHUB_ENV
          mkdir -p "backups/$DATE/storage"
          mkdir -p "backups/$DATE/config"

      - name: 1. Dump do Banco de Dados (Schema + Dados + Permissões)
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --clean \
            --if-exists \
            --no-owner \
            | gzip > "backups/${{ env.TODAY_DATE }}/banco_completo.sql.gz"

      - name: 2. Download dos Arquivos do Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUTPUT_STORAGE_DIR: "backups/${{ env.TODAY_DATE }}/storage"
        run: node download_storage.js

      - name: 3. Backup de Configurações, Auth e Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OUTPUT_CONFIG_DIR: "backups/${{ env.TODAY_DATE }}/config"
        run: node backup_config.js

      - name: 4. Compactar e Upload para SharePoint
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
          SHAREPOINT_REMOTE_FOLDER: ${{ secrets.SHAREPOINT_PATH }}
          TODAY_DATE: ${{ env.TODAY_DATE }}
        run: |
          ARCHIVE="backup-${{ env.TODAY_DATE }}.tar.gz"
          tar -czf "$ARCHIVE" -C "backups/${{ env.TODAY_DATE }}" .
          echo "Arquivo criado: $ARCHIVE ($(du -sh $ARCHIVE | cut -f1))"
          LOCAL_BACKUP_FILE="$ARCHIVE" node upload_sharepoint.js
