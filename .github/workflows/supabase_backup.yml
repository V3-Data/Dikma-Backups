          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FINANCEIRO_SUPABASE_SERVICE_ROLE_KEY }}
          OUTPUT_STORAGE_DIR: "backups/${{ env.TODAY_DATE }}/storage"
        run: node download_storage.js

      - name: 3. Backup de Configurações, Auth e Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.FINANCEIRO_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.FINANCEIRO_SUPABASE_URL }}
