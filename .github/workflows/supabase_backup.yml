name: Backup Supabase para VM do Cliente

on:
  schedule:
    - cron: '0 6 * * *' # Todo dia às 06:00 UTC (03:00 Horário de Brasília)
  workflow_dispatch:

jobs:
  backup-crm-vt:
    name: Backup — CRM e Visita Técnica
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Instalar Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates openvpn
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          npm install

      - name: Criar Estrutura de Pastas e Definir Data
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "TODAY_DATE=$DATE" >> $GITHUB_ENV
          mkdir -p "backups/$DATE/storage"
          mkdir -p "backups/$DATE/config"

      - name: 1. Dump do Banco de Dados (Schema + Dados + Permissões)
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.CRM_VT_SUPABASE_DB_URL }}" \
            --clean \
            --if-exists \
            --no-owner \
            | gzip > "backups/${{ env.TODAY_DATE }}/banco_completo.sql.gz"

      - name: 2. Download dos Arquivos do Storage
        env:
          SUPABASE_URL: ${{ secrets.CRM_VT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CRM_VT_SUPABASE_SERVICE_ROLE_KEY }}
          OUTPUT_STORAGE_DIR: "backups/${{ env.TODAY_DATE }}/storage"
        run: node download_storage.js

      - name: 3. Backup de Configurações, Auth e Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.CRM_VT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.CRM_VT_SUPABASE_URL }}
          OUTPUT_CONFIG_DIR: "backups/${{ env.TODAY_DATE }}/config"
        run: node backup_config.js

      - name: 4. Compactar o Backup
        run: |
          ARCHIVE="backup-${{ env.TODAY_DATE }}.tar.gz"
          tar -czf "$ARCHIVE" -C "backups/${{ env.TODAY_DATE }}" .
          echo "Arquivo criado: $ARCHIVE ($(du -sh $ARCHIVE | cut -f1))"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: 5. Conectar ao OpenVPN
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
        run: |
          printf '%s' "$OPENVPN_CONFIG" > /tmp/vpn.ovpn
          printf '%s\n%s\n' "$OPENVPN_USERNAME" "$OPENVPN_PASSWORD" > /tmp/vpn-auth.txt
          sudo openvpn --config /tmp/vpn.ovpn --auth-user-pass /tmp/vpn-auth.txt --daemon --log /tmp/vpn.log
          echo "Aguardando VPN conectar (max 60s)..."
          CONNECTED=false
          for i in $(seq 1 30); do
            if ip addr show type tun 2>/dev/null | grep -q "inet "; then
              CONNECTED=true
              break
            fi
            if ! pgrep -x openvpn > /dev/null; then
              echo "Processo OpenVPN encerrou inesperadamente."
              break
            fi
            echo "  aguardando... ($i/30)"
            sleep 2
          done
          echo "=== OpenVPN log ==="
          sudo cat /tmp/vpn.log
          if [ "$CONNECTED" != "true" ]; then
            exit 1
          fi
          echo "VPN conectada: $(ip addr show type tun | grep 'inet ')"

      - name: 6. Upload para VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s' "$SSH_PRIVATE_KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          PORT=$(echo "${{ secrets.SSH_PORT }}" | tr -cd '0-9')
          PORT="${PORT:-22}"
          REMOTE_DIR="${{ secrets.CRM_VT_SSH_PATH }}/${{ env.TODAY_DATE }}"
          COMMON_OPTS="-i /tmp/ssh_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -p "$PORT" $COMMON_OPTS "$REMOTE" "mkdir -p $REMOTE_DIR"
          echo "Enviando ${{ env.ARCHIVE }} ($(du -sh ${{ env.ARCHIVE }} | cut -f1)) → $REMOTE_DIR/"
          scp -P "$PORT" $COMMON_OPTS "${{ env.ARCHIVE }}" "$REMOTE:$REMOTE_DIR/"
          rm -f /tmp/ssh_key
          echo "Upload concluído!"

      - name: 7. Desconectar OpenVPN
        if: always()
        run: sudo pkill openvpn || true

